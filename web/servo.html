<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontrolli i Servos (USB)</title>
<style>
  body { font-family: sans-serif; background: #1e1e2e; color: #eee; text-align: center; margin: 0; padding: 20px; }
  h1 { font-size: 22px; }
  .card { background: #2a2a3d; border-radius: 16px; padding: 20px; max-width: 380px; margin: 0 auto; }
  #arm { transition: transform 0.4s ease; transform-origin: 150px 150px; }
  .angle { font-size: 40px; font-weight: bold; margin: 5px 0; }
  .status { color: #aaa; margin-bottom: 15px; }
  input[type=range] { width: 100%; margin: 15px 0; }
  button { font-size: 16px; padding: 12px 0; margin: 4px; border: none; border-radius: 10px; color: #fff; width: 30%; cursor: pointer; }
  button:disabled { opacity: 0.35; cursor: default; }
  .connect { background: #8e44ad; width: 94%; }
  .go { background: #2e9e5b; } .stop { background: #c0392b; } .pos { background: #3b6fd8; }
  #log { background: #111; color: #7f7; font-family: monospace; font-size: 12px; text-align: left;
         height: 110px; overflow-y: auto; padding: 8px; border-radius: 8px; margin-top: 15px; white-space: pre-wrap; }
  .warn { color: #f88; }
</style>
</head>
<body>
<div class="card">
  <h1>Kontrolli i Servos (USB)</h1>
  <p class="warn" id="noSerial" hidden>Ky browser nuk e njeh USB-në. Hape këtë faqe me Chrome ose Edge.</p>
  <button class="connect" id="connectBtn">🔌 Lidhu me ESP32</button>

  <svg viewBox="0 0 300 170" width="100%">
    <path d="M 30 150 A 120 120 0 0 1 270 150" fill="none" stroke="#555" stroke-width="4"/>
    <text x="20" y="168" fill="#888" font-size="12">0°</text>
    <text x="140" y="22" fill="#888" font-size="12">90°</text>
    <text x="262" y="168" fill="#888" font-size="12">180°</text>
    <g id="arm">
      <rect x="144" y="45" width="12" height="105" rx="6" fill="#f5a623"/>
    </g>
    <circle cx="150" cy="150" r="16" fill="#ddd"/>
  </svg>
  <div class="angle"><span id="deg">90</span>°</div>
  <div class="status" id="status">Jo i lidhur</div>

  <input type="range" id="slider" min="0" max="180" value="90" disabled>
  <div>
    <button class="go ctl" onclick="send('start')" disabled>Start</button>
    <button class="stop ctl" onclick="send('stop')" disabled>Stop</button>
  </div>
  <div>
    <button class="pos ctl" onclick="send(0)" disabled>0°</button>
    <button class="pos ctl" onclick="send(90)" disabled>90°</button>
    <button class="pos ctl" onclick="send(180)" disabled>180°</button>
  </div>
  <div id="log"></div>
</div>

<script>
  const slider = document.getElementById('slider');
  const logBox = document.getElementById('log');
  let port, writer, dragging = false, lastSend = 0, sweeping = false;

  if (!('serial' in navigator)) document.getElementById('noSerial').hidden = false;

  function log(text) {
    logBox.textContent += text + '\n';
    logBox.scrollTop = logBox.scrollHeight;
  }

  // Vizatimi: 0° = majtas, 90° = lart, 180° = djathtas
  function show(angle) {
    document.getElementById('arm').style.transform = 'rotate(' + (angle - 90) + 'deg)';
    document.getElementById('deg').textContent = angle;
    if (!dragging) slider.value = angle;
  }

  function setConnected(on) {
    slider.disabled = !on;
    document.querySelectorAll('.ctl').forEach(b => b.disabled = !on);
    document.getElementById('connectBtn').textContent = on ? '✅ I lidhur me ESP32' : '🔌 Lidhu me ESP32';
    document.getElementById('status').textContent = on ? 'Në pritje' : 'Jo i lidhur';
  }

  async function send(cmd) {
    if (!writer) return;
    log('> ' + cmd);
    await writer.write(new TextEncoder().encode(cmd + '\n'));
  }

  // Lexon rreshtat që dërgon ESP32, p.sh. "STATE angle=90 sweep=0"
  function handleLine(line) {
    line = line.trim();
    if (!line) return;
    log(line);
    const m = line.match(/STATE angle=(\d+) sweep=(\d)/);
    if (m) {
      sweeping = m[2] === '1';
      show(+m[1]);
      document.getElementById('status').textContent = sweeping ? 'Po lëviz vetë (Start)' : 'Në pritje';
    }
  }

  async function connect() {
    try {
      port = await navigator.serial.requestPort();      // Chrome të pyet cilën portë COM
      await port.open({ baudRate: 115200 });
      writer = port.writable.getWriter();
      setConnected(true);
      log('-- U lidh. --');
      setTimeout(() => send('state'), 1500);           // pyet ku është servo
      readLoop();
    } catch (e) {
      log('Gabim: ' + e.message);
      if (e.message.includes('open')) log('A është i hapur Serial Monitor në VS Code? Mbylle dhe provo përsëri.');
    }
  }

  async function readLoop() {
    const reader = port.readable.pipeThrough(new TextDecoderStream()).getReader();
    let buffer = '';
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        const lines = buffer.split('\n');
        buffer = lines.pop();
        lines.forEach(handleLine);
      }
    } catch (e) {
      log('-- U shkëput: ' + e.message);
    }
    writer = null;
    setConnected(false);
  }

  document.getElementById('connectBtn').addEventListener('click', () => { if (!writer) connect(); });

  // Rrëshqitësi: vizatimi lëviz menjëherë, komanda dërgohet çdo 100 ms
  slider.addEventListener('input', () => {
    dragging = true;
    show(+slider.value);
    if (Date.now() - lastSend > 100) { lastSend = Date.now(); send(slider.value); }
  });
  slider.addEventListener('change', () => { dragging = false; send(slider.value); });
</script>
</body>
</html>
